name: CD

# Publication is manual-only in this fork.
#
# Upstream triggers this on a successful CI run on `main`, which means any
# `fix:`-prefixed commit attempts a patch release. That is not wanted here: this
# fork is consumed from its default branch, and an accidental npm publish under
# the maintainer's account is not recoverable by editing a file here.
#
# Run it deliberately with: gh workflow run cd.yml --repo BaconDroid/opencode-snip
# Requires NPM_TOKEN in the repository secrets; without it the release step
# fails and nothing is published.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
